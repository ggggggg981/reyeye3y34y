    <link rel="stylesheet" href="styles/style-1.css">

<body>
    <h1>Стихотворение и автор</h1>
    <p>
        Ночевала тучка золотая<br>
        На груди утёса-великана.<br>
        Утром в путь она умчалась рано,<br>
        По лазури весело играя;<br>
        <br>
        Но остался влажный след в морщине,<br>
        Старого утёса. Одиноко<br>
        Он стоит, задумался глубоко<br>
        И тихонько плачет он в пустыне.
    </p>
    <img src="images/3.png" alt="Портрет автора">
