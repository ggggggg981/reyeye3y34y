<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>практические работы</title>
    <style>
        /* Базовые настройки страницы */
        body {
            font-family: Arial, sans-serif; /* Простой и читаемый шрифт */
            background-color: #f4f4f9;      /* Светло-серый фон */
            color: #333;                    /* Тёмно-серый текст */
            text-align: center;             /* Всё по центру */
            padding-top: 50px;
        }

        h1 {
            margin-bottom: 40px;
        }

        /* Контейнер для кнопок */
        .menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* Расстояние между кнопками */
        }

        /* Стиль кнопок-ссылок */
        .btn {
            display: block;
            width: 300px;
            padding: 15px;
            background-color: #007bff; /* Спокойный синий цвет */
            color: white;
            text-decoration: none;     /* Убираем подчёркивание ссылки */
            border-radius: 5px;        /* Слегка скруглённые углы */
            font-size: 18px;
            transition: background-color 0.2s; /* Плавная смена цвета */
        }

        /* Эффект при наведении мышки */
        .btn:hover {
            background-color: #0056b3; /* Цвет становится чуть темнее */
        }
    </style>
</head>
<body>

    <h1>Практические работы по HTML</h1>
    
    <div class="menu">
        <a href="practice-1.html" class="btn">Практическая работа 1</a>
        <a href="practice-2.html" class="btn">Практическая работа 2</a>
        <a href="practice-3.html" class="btn">Практическая работа 3</a>
    </div>

</body>
</html>
